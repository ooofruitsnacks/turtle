name: Turtle

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            archive_ext: tar.gz
            exe: ""
            python: python3
          - name: macos-silicon
            runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            archive_ext: tar.gz
            exe: ""
            python: python3
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            archive_ext: zip
            exe: ".exe"
            python: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Intel macOS target
        if: matrix.os == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          ${{ matrix.python }} --version

      - name: cargo check
        run: cargo check --locked --all-targets --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check and build Intel macOS binary (cross-compiled)
        if: matrix.os == 'macos'
        run: |
          cargo check --locked --all-targets --target x86_64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Smoke test executable
        run: ./target/${{ matrix.target }}/release/turtle${{ matrix.exe }} --help

      - name: Package release
        run: |
          set -euo pipefail
          ${{ matrix.python }} .github/scripts/package-release.py \
            --target "${{ matrix.target }}" \
            --name "${{ matrix.name }}" \
            --binary "target/${{ matrix.target }}/release/turtle${{ matrix.exe }}" \
            --archive-ext "${{ matrix.archive_ext }}"
          test -s "dist/turtle-${{ matrix.name }}.${{ matrix.archive_ext }}"

      - name: Package Intel macOS release
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py \
            --target "x86_64-apple-darwin" \
            --name "macos-intel" \
            --binary "target/x86_64-apple-darwin/release/turtle" \
            --archive-ext "tar.gz"
          test -s "dist/turtle-macos-intel.tar.gz"

      - name: List packaged files
        run: ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-debian:
    name: debian-12-aarch64
    runs-on: ubuntu-24.04-arm
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install base tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev git ca-certificates python3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain stable \
            --profile minimal \
            --target aarch64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian-12-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            debian-12-aarch64-cargo-

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: cargo check
        run: cargo check --locked --all-targets --target aarch64-unknown-linux-gnu

      - name: cargo test
        run: cargo test --locked --all-targets --target aarch64-unknown-linux-gnu

      - name: cargo build --release
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu

      - name: Smoke test executable
        run: ./target/aarch64-unknown-linux-gnu/release/turtle --help

      - name: Package release
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py \
            --target "aarch64-unknown-linux-gnu" \
            --name "debian-12-aarch64" \
            --binary "target/aarch64-unknown-linux-gnu/release/turtle" \
            --archive-ext "tar.gz"
          test -s "dist/turtle-debian-12-aarch64.tar.gz"

      - name: List packaged files
        run: ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-debian-12-aarch64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build, build-debian]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Download all executable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turtle-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts (debug)
        run: find artifacts -type f -print | sort

      - name: Flatten archives and verify all platforms are present
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release-files/ \;

          cd release-files

          expected=(
            "turtle-ubuntu-24.04-aarch64.tar.gz"
            "turtle-debian-12-aarch64.tar.gz"
            "turtle-macos-silicon.tar.gz"
            "turtle-macos-intel.tar.gz"
            "turtle-windows-x86_64.zip"
          )

          for archive in "${expected[@]}"; do
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing or empty release archive: $archive"
              exit 1
            fi
          done

      - name: Generate combined SHA256 checksums.txt
        run: |
          set -euo pipefail
          cd release-files
          sha256sum -- *.tar.gz *.zip > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-files

          gh release create "$RELEASE_TAG" \
            turtle-ubuntu-24.04-aarch64.tar.gz \
            turtle-debian-12-aarch64.tar.gz \
            turtle-macos-silicon.tar.gz \
            turtle-macos-intel.tar.gz \
            turtle-windows-x86_64.zip \
            checksums.txt \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Turtle $RELEASE_TAG" \
            --generate-notes

