name: Turtle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            archive_ext: tar.gz
          - name: debian-12-aarch64
            runner: ubuntu-24.04-arm
            container: debian:12
            target: aarch64-unknown-linux-gnu
            os: linux
            archive_ext: tar.gz
          - name: macos
            runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            archive_ext: tar.gz
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            archive_ext: zip

    steps:
      - name: Install base tools (Debian container only)
        if: matrix.container == 'debian:12'
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev git ca-certificates python3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (non-Debian-container jobs)
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (Debian container job)
        if: matrix.container == 'debian:12'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Add both macOS targets
        if: matrix.os == 'macos'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check Intel macOS target (cross-compiled)
        if: matrix.os == 'macos'
        run: cargo check --locked --all-targets --target x86_64-apple-darwin

      - name: Build Intel binary (cross-compiled)
        if: matrix.os == 'macos'
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: cargo check
        run: cargo check --locked --all-targets --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test executable (native runners only)
        if: matrix.os != 'windows' && matrix.container == ''
        run: ./target/${{ matrix.target }}/release/turtle --help

      - name: Smoke test executable (Windows)
        if: matrix.os == 'windows'
        run: .\target\${{ matrix.target }}\release\turtle.exe --help

      - name: Package release (Unix)
        if: matrix.os != 'windows'
        run: |
          python3 .github/scripts/package-release.py \
            --target "${{ matrix.target }}" \
            --name "${{ matrix.name }}" \
            --binary "target/${{ matrix.target }}/release/turtle" \
            --archive-ext "${{ matrix.archive_ext }}"

      - name: Package windows release
        if: matrix.os == 'windows'
        run: |
          python .github/scripts/package-release.py `
            --target "${{ matrix.target }}" `
            --name "${{ matrix.name }}" `
            --binary "target/${{ matrix.target }}/release/turtle.exe" `
            --archive-ext "${{ matrix.archive_ext }}"

      - name: Package Intel macOS release
        if: matrix.os == 'macos'
        run: |
          python3 .github/scripts/package-release.py \
            --target "x86_64-apple-darwin" \
            --name "macos-intel" \
            --binary "target/x86_64-apple-darwin/release/turtle" \
            --archive-ext "tar.gz"


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download all executable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turtle-*
          path: release-assets
          merge-multiple: true

      - name: Verify release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          expected=(
            "turtle-ubuntu-24.04-aarch64.tar.gz"
            "turtle-debian-12-aarch64.tar.gz"
            "turtle-macos-apple-silicon.tar.gz"
            "turtle-macos-intel.tar.gz"
            "turtle-windows-x86_64.zip"
          )

          for archive in "${expected[@]}"; do
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing or empty release archive: $archive"
              exit 1
            fi

            if [[ ! -s "$archive.sha256" ]]; then
              echo "::error::Missing checksum: $archive.sha256"
              exit 1
            fi

            sha256sum --check "$archive.sha256"
          done

      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets

          archives=(
            "turtle-ubuntu-24.04-aarch64.tar.gz"
            "turtle-debian-12-aarch64.tar.gz"
            "turtle-macos-apple-silicon.tar.gz"
            "turtle-macos-intel.tar.gz"
            "turtle-windows-x86_64.zip"
          )

          assets=()
          for archive in "${archives[@]}"; do
            assets+=("$archive" "$archive.sha256")
          done

          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Turtle $RELEASE_TAG" \
            --generate-notes
