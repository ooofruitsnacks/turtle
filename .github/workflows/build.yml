name: Turtle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            archive_ext: tar.gz
          - name: debian-12-aarch64
            runner: ubuntu-24.04-arm
            container: debian:12
            target: aarch64-unknown-linux-gnu
            os: linux
            archive_ext: tar.gz
          - name: macos-apple-silicon
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            archive_ext: tar.gz
          - name: macos-intel
            runner: macos-13
            target: x86_64-apple-darwin
            os: macos
            archive_ext: tar.gz
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            archive_ext: zip

    steps:
      - name: Install base tools (Debian container only)
        if: matrix.container == 'debian:12'
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (non-Debian-container jobs)
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (Debian container job)
        if: matrix.container == 'debian:12'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: cargo check
        run: cargo check --locked --all-targets --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test executable (native runners only)
        if: matrix.os != 'windows' && matrix.container == ''
        run: ./target/${{ matrix.target }}/release/turtle --help

      - name: Smoke test executable (Windows)
        if: matrix.os == 'windows'
        run: .\target\${{ matrix.target }}\release\turtle.exe --help

      - name: Package release (Unix)
        if: matrix.os != 'windows'
        run: |
          python3 .github/scripts/package-release.py \
            --target "${{ matrix.target }}" \
            --name "${{ matrix.name }}" \
            --binary "target/${{ matrix.target }}/release/turtle" \
            --archive-ext "${{ matrix.archive_ext }}"

      - name: Package release (Windows)
        if: matrix.os == 'windows'
        run: |
          python .github/scripts/package-release.py `
            --target "${{ matrix.target }}" `
            --name "${{ matrix.name }}" `
            --binary "target/${{ matrix.target }}/release/turtle.exe" `
            --archive-ext "${{ matrix.archive_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

